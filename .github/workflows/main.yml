name: Build Android APK (বং বাজার দর্শন)

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup Expo
        uses: expo/expo-github-action@v8
        with:
          expo-version: latest
          eas-version: latest

      - name: Install dependencies
        run: npm install

      - name: Build on EAS
        uses: expo/expo-github-action/build@v8
        with:
          project-dir: .
          platform: android
          profile: preview
          token: ${{ secrets.EXPO_TOKEN }}
