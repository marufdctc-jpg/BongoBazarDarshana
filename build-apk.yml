name: 📱 Build Android APK (বঙ্গ বাজার দর্শনা)

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]

jobs:
  build-apk:
    name: 🔨 Generate APK
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout repository
        uses: actions/checkout@v4

      - name: ☕ Setup Java 17 (JDK)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: 🟢 Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: 🤖 Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: 📦 Install Node dependencies
        run: npm install

      - name: ⚙️ Generate Android Native Files (Expo Prebuild)
        run: npx expo prebuild --platform android --clean

      - name: 🔨 Build Release APK via Gradle
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon

      - name: 📤 Upload Generated APK
        uses: actions/upload-artifact@v4
        with:
          name: BongoBazarDarshana-v2.0.0-Release-APK
          path: android/app/build/outputs/apk/release/*.apk
          retention-days: 30
